# ConVol development / demo stack.
#
# Brings up Postgres + auto-runs the schema migrations + starts the Next.js app.
# One command from a fresh clone:
#
#   cp .env.example .env       # then set SESSION_SECRET (and Sched keys if used)
#   docker compose up
#
# Open http://localhost:3000, then visit /setup to create the first staff account.
#
# Notes:
#   - Postgres data persists in the `convol_pg_data` named volume across restarts.
#     `docker compose down -v` wipes it.
#   - The `migrate` service runs to completion and exits; `app` waits for it.
#     It uses the same psql-based runner (scripts/migrate.sh) that production
#     uses, so a fresh clone reproduces production's migration behavior exactly.
#   - This file is intended for local dev and small self-hosted deployments.
#     Production hardening (backups, TLS, reverse proxy, resource limits) is
#     the operator's responsibility. See docs/architecture/decisions.md.

name: convol

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-convol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convol}
      POSTGRES_DB:       ${POSTGRES_DB:-convol}
    volumes:
      - convol_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convol} -d ${POSTGRES_DB:-convol}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # Uncomment to expose Postgres to the host (for psql access from your machine).
    # ports:
    #   - "5432:5432"

  # One-shot schema migrations. Uses psql from the postgres image (no app build
  # needed) and the canonical runner in scripts/migrate.sh.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-convol}:${POSTGRES_PASSWORD:-convol}@postgres:5432/${POSTGRES_DB:-convol}
    volumes:
      - ./migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /migrate.sh"]
    restart: "no"

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-convol}:${POSTGRES_PASSWORD:-convol}@postgres:5432/${POSTGRES_DB:-convol}
      # Staff session signing secret. Required — compose fails fast if unset.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (see .env.example)}
      # Optional: restrict who can claim the first staff account at /setup.
      CONVOL_ROOT_ADMIN_EMAIL: ${CONVOL_ROOT_ADMIN_EMAIL:-}
      # Sched integration (optional).
      SCHED_URL:                   ${SCHED_URL:-}
      SCHED_TOKEN:                 ${SCHED_TOKEN:-}
      NEXT_PUBLIC_SCHED_EVENT_URL: ${NEXT_PUBLIC_SCHED_EVENT_URL:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  convol_pg_data:
    name: convol_pg_data
